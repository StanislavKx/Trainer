<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>Тренажёр к тесту</title>
<style>
:root {
  --ink: #1C1F24;
  --ink-2: #464D57;
  --muted: #6B727D;
  --rule: #E2E5E9;
  --line: #C4C9D0;
  --field: #F2F3F5;
  --navy: #1F3B63;
  --navy-tint: #EAF0F7;
  --green: #22663F;
  --green-tint: #E8F3EC;
  --red: #B3261E;
  --red-tint: #FBECEA;
  --serif: "PT Serif", Georgia, "Noto Serif", "Droid Serif", "Times New Roman", serif;
  --sans: "PT Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --r: 10px;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: #fff; color: var(--ink); font: 16px/1.5 var(--sans); -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p, ol, ul, dl, dd { margin: 0; }
:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
.noscript { max-width: 600px; margin: 40px auto; padding: 0 16px; font-size: 18px; }
.wrap { max-width: 600px; margin: 0 auto; padding: 28px 16px 40px; }

/* Buttons */
.btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 50px; padding: 10px 18px;
  border: 1px solid transparent; border-radius: var(--r); background: var(--navy); color: #fff;
  font-weight: 700; font-size: 16px; line-height: 1.2; text-align: center; }
.btn:disabled { opacity: .38; cursor: default; }
.btn-quiet { background: #fff; color: var(--ink); border-color: var(--line); }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }
.linkbtn { background: none; border: 0; padding: 8px 0; color: var(--navy); font-size: 15px;
  text-decoration: underline; text-underline-offset: 3px; }

/* Home */
.mast h1 { font: 700 34px/1.12 var(--serif); letter-spacing: -.015em; }
.mast p { margin-top: 10px; color: var(--ink-2); max-width: 34em; }
.notice { margin-top: 22px; padding: 14px 16px; border-left: 4px solid var(--navy); background: var(--navy-tint);
  border-radius: 0 var(--r) var(--r) 0; }
.notice p { margin-bottom: 12px; }

.slate { margin: 28px 0 40px; background: #000; color: #fff; border: 2px solid #000; border-radius: 8px; overflow: hidden; }
.slate-sticks { height: 30px; border-bottom: 3px solid #fff;
  background: repeating-linear-gradient(118deg, #fff 0 17px, #000 17px 34px); }
.slate-body { padding: 18px 18px 0; }
.slate h2 { font: 700 27px/1.15 var(--serif); }
.slate-body p { margin-top: 8px; color: #C9CDD3; font-size: 15px; }
.slate-grid { display: grid; grid-template-columns: 1fr 1fr; margin-top: 18px; border-top: 1px solid #50565F; }
.slate-grid > div { padding: 10px 18px 12px; border-bottom: 1px solid #50565F; }
.slate-grid > div:nth-child(odd) { border-right: 1px solid #50565F; }
.slate-grid span { display: block; font-size: 13px; color: #AEB4BC; }
.slate-grid b { font: 700 30px/1.1 var(--serif); font-variant-numeric: lining-nums tabular-nums; }
.slate-foot { padding: 16px 18px 18px; }
.slate-warn { margin-bottom: 12px; color: #F2C7C3; font-size: 14px; }
.btn-slate { background: #fff; color: #000; }

.sec h2, .redo h2 { font: 700 24px/1.2 var(--serif); }
.sec > p, .redo > p { margin-top: 6px; color: var(--ink-2); }
.field { margin: 22px 0 0; padding: 0; border: 0; min-width: 0; }
.field legend { padding: 0; margin-bottom: 10px; font-weight: 700; font-size: 15px; }
.group-label { margin: 14px 0 8px; font-size: 14px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 7px 14px; border: 1px solid var(--line); border-radius: 20px; background: #fff;
  color: var(--ink-2); font-size: 15px; line-height: 1.3; text-align: left; }
.chip[aria-pressed="true"] { background: var(--navy-tint); border-color: var(--navy); color: var(--navy);
  box-shadow: inset 0 0 0 1px var(--navy); }
.chip[aria-pressed="true"]::before { content: "✓"; margin-right: 6px; font-weight: 700; }
.seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line);
  border-radius: var(--r); overflow: hidden; }
.seg button { min-height: 44px; border: 0; border-left: 1px solid var(--line); background: #fff; font-weight: 700;
  font-variant-numeric: tabular-nums; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--navy); color: #fff; }
.avail { margin: 18px 0 12px; color: var(--muted); font-size: 15px; }
.redo { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--rule); }
.redo .btn-row { margin-top: 14px; }
.redo .btn-quiet { flex: 0 0 auto; width: auto; }
.foot { margin-top: 44px; padding-top: 14px; border-top: 1px solid var(--rule); display: flex; flex-wrap: wrap;
  justify-content: space-between; align-items: center; gap: 4px 16px; color: var(--muted); font-size: 14px; }

/* Question screen */
.screen { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.qtop { position: sticky; top: 0; z-index: 5; background: #fff; }
.qtop-in { max-width: 600px; margin: 0 auto; padding: 4px 16px; min-height: 50px; display: flex; align-items: center; gap: 12px; }
.qtop .linkbtn { font-weight: 700; text-decoration: none; padding: 10px 0; }
.qpos { margin-left: auto; color: var(--ink-2); font-size: 15px; font-variant-numeric: tabular-nums; }
.progress { height: 3px; background: var(--rule); }
.progress i { display: block; height: 100%; background: var(--navy); transition: width .25s ease; }
.qmain { flex: 1; width: 100%; padding-top: 22px; }
.qmeta { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 12px; font-size: 14px; color: var(--muted); }
.qmeta span:last-child { text-align: right; }
.qtext { margin-bottom: 18px; font: 400 21px/1.45 var(--serif); color: var(--ink); }
.hint { margin: -8px 0 18px; font-size: 14px; color: var(--muted); }

.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: flex-start; gap: 12px; width: 100%; min-height: 54px; padding: 13px 14px;
  border: 1px solid var(--line); border-radius: var(--r); background: #fff; text-align: left; line-height: 1.4;
  transition: border-color .12s, background-color .12s; }
.opt .mk { flex: 0 0 24px; width: 24px; height: 24px; margin-top: -1px; border: 2px solid var(--line); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; }
.is-multi .mk, .is-order .mk { border-radius: 6px; }
.opt[aria-checked="true"], .opt[aria-pressed="true"] { border-color: var(--navy); background: var(--navy-tint); }
.opt[aria-checked="true"] .mk, .opt[aria-pressed="true"] .mk { border-color: var(--navy); background: var(--navy); }
.is-single .opt[aria-checked="true"] .mk::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
.is-multi .opt[aria-checked="true"] .mk::after { content: ""; width: 10px; height: 6px; margin-top: -3px;
  border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg); }
.opt[aria-disabled="true"] { cursor: default; }
.otext { min-width: 0; }
.tag { display: block; margin-top: 4px; font-size: 13px; font-weight: 700; }
.opt.is-ok { border-color: var(--green); background: var(--green-tint); }
.opt.is-ok .mk { border-color: var(--green); background: var(--green); }
.opt.is-bad { border-color: var(--red); background: var(--red-tint); }
.opt.is-bad .mk { border-color: var(--red); background: var(--red); }
.opt.is-missed { border: 2px dashed var(--green); background: #fff; padding: 12px 13px; }
.opt.is-missed .mk { border-color: var(--green); background: #fff; }
.is-ok .tag, .is-missed .tag { color: var(--green); }
.is-bad .tag { color: var(--red); }
.opts + .linkbtn { margin-top: 6px; }

.defs { list-style: none; padding: 0; margin: 0 0 10px; border-top: 1px solid var(--rule); }
.defs li { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); line-height: 1.4; }
.defs b { flex: 0 0 18px; color: var(--navy); }
.mrow { padding: 14px 0 12px; border-bottom: 1px solid var(--rule); }
.mleft { display: flex; gap: 10px; margin-bottom: 10px; font: 400 18px/1.35 var(--serif); }
.mleft b { flex: 0 0 18px; font: 700 16px/1.5 var(--sans); color: var(--ink-2); }
.letters { display: grid; gap: 8px; }
.letters button { min-height: 44px; border: 1px solid var(--line); border-radius: var(--r); background: #fff;
  font-weight: 700; font-size: 16px; }
.letters button[aria-checked="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
.letters button.is-ok { background: var(--green); border-color: var(--green); color: #fff; }
.letters button.is-bad { background: var(--red); border-color: var(--red); color: #fff; }
.letters button.is-missed { border: 2px dashed var(--green); color: var(--green); }
.letters button[aria-disabled="true"] { cursor: default; }
.mnote { margin-top: 8px; font-size: 14px; font-weight: 700; color: var(--green); }

.text-in { width: 100%; min-height: 54px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r);
  background: #fff; font-size: 18px; }
.text-in:focus { outline: 2px solid var(--navy); outline-offset: 0; border-color: var(--navy); }
.text-in.is-ok { border-color: var(--green); background: var(--green-tint); }
.text-in.is-bad { border-color: var(--red); background: var(--red-tint); }
.text-in[readonly]:focus { outline: none; }

.fb { margin-top: 18px; scroll-margin-bottom: 110px; }
.fb p + p, .fb p + ol { margin-top: 6px; }
.fb b { font-weight: 700; }
.fb-list { padding-left: 1.4em; color: var(--ink-2); }
.fb-list li { margin-top: 2px; }

.actions { position: sticky; bottom: 0; z-index: 5; background: #fff; border-top: 1px solid var(--rule); }
.actions.is-ok { background: var(--green-tint); border-top-color: var(--green); }
.actions.is-bad { background: var(--red-tint); border-top-color: var(--red); }
.actions-in { max-width: 600px; margin: 0 auto; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  display: flex; align-items: center; gap: 10px; }
.actions .btn { flex: 1; }
.actions .btn-quiet { flex: 0 0 auto; width: auto; padding: 10px 16px; }
.actions .btn.next { flex: 0 0 auto; width: auto; min-width: 140px; }
.verdict { flex: 1; font: 700 19px/1.2 var(--sans); }
.verdict.ok { color: var(--green); }
.verdict.bad { color: var(--red); }

/* Results */
.res-head { padding-bottom: 22px; border-bottom: 1px solid var(--rule); }
.res-head h1 { font: 700 22px/1.25 var(--serif); }
.score { margin-top: 14px; font: 700 68px/1 var(--serif); letter-spacing: -.02em; font-variant-numeric: lining-nums tabular-nums; }
.score small { font-size: 26px; font-weight: 400; color: var(--ink-2); letter-spacing: 0; }
.res-sub { margin-top: 10px; color: var(--ink-2); }
.brk { margin-top: 28px; }
.brk h2, .mist h2 { font: 700 18px/1.3 var(--sans); }
.brk .lead { margin-top: 4px; color: var(--ink-2); }
.brk .lead b { color: var(--red); }
.brows { margin-top: 8px; }
.brow { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.brow .n { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--field); overflow: hidden; }
.track i { display: block; height: 100%; background: var(--navy); }
.brow.weak .track i { background: var(--red); }
.brow.weak .n { color: var(--red); font-weight: 700; }
.mist { margin-top: 34px; }
.mitem { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.mitem .ms { font-size: 13px; color: var(--muted); }
.mitem .mq { margin-top: 4px; font: 400 17px/1.45 var(--serif); }
.mitem dl { margin-top: 8px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; font-size: 15px; }
.mitem dt { color: var(--muted); }
.mitem dd { white-space: pre-line; }
.mitem dd.y { color: var(--red); }
.mitem dd.c { color: var(--green); font-weight: 700; }
.res-actions { margin-top: 28px; display: grid; gap: 10px; }
.none { margin-top: 8px; color: var(--ink-2); }

/* Teacher */
.t-sec { margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--rule); }
.t-sec h2 { font: 700 21px/1.25 var(--serif); }
.t-sec > p { margin-top: 6px; color: var(--ink-2); }
.t-msg { margin-top: 18px; padding: 12px 14px; background: var(--green-tint); border-left: 4px solid var(--green);
  border-radius: 0 var(--r) var(--r) 0; }
.checks { margin-top: 12px; }
.check { display: flex; align-items: center; gap: 12px; min-height: 46px; border-bottom: 1px solid var(--rule); }
.check input { width: 20px; height: 20px; margin: 0; accent-color: var(--navy); }
.check small { margin-left: auto; color: var(--muted); font-size: 14px; white-space: nowrap; }
.file-btn { position: relative; overflow: hidden; margin-top: 14px; }
.file-btn input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.report { margin-top: 14px; }
.rep { list-style: none; padding: 0; }
.rep > li { padding: 10px 0; border-bottom: 1px solid var(--rule); }
.rep-name { font-weight: 700; }
.rep-meta { color: var(--ink-2); font-size: 15px; }
.rep-err { margin-top: 6px; padding-left: 1.2em; color: var(--red); font-size: 14px; }
.rep-note { margin: 12px 0; color: var(--ink-2); font-size: 15px; }
.t-sec .btn { margin-top: 14px; }
.fmt dl { margin-top: 12px; }
.fmt dt { margin-top: 14px; font-weight: 700; }
.fmt dd { margin-top: 4px; color: var(--ink-2); }
.fmt code { padding: 1px 5px; border-radius: 4px; background: var(--field); font-size: 14px; word-break: break-word; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
@media (min-width: 700px) {
  .wrap { padding-top: 48px; }
  .mast h1 { font-size: 42px; }
}
</style>
</head>

<script id="bank" type="application/json">{"version":1,"mock":{"total":40,"theatreShare":0.5,"types":{"single":0.1,"multi":0.1,"order":0.1,"match":0.1,"short":0.6}},"subjects":[{"name":"Работа с камерой","theatre":true,"csv":"Q;Q_opt;Answer\nКак называется точка зрения камеры на объект съемки, например сверху, снизу или сбоку?;\"A) Фокус; B) Ракурс; C) Хромакей; D) Экспозиция\";B\nДля чего во время съемки используют хлопушку?;\"A) Чтобы подать сигнал к перерыву; B) Чтобы позвать актеров на грим; C) Чтобы обозначить снимаемый фрагмент и синхронизировать изображение со звуком; D) Чтобы проверить освещение\";C\nКуда, как правило, не должен смотреть актер во время съемки игровой сцены, если режиссер не ставит особой задачи?;\"A) На партнера; B) На предмет, с которым действует персонаж; C) В точку, указанную режиссером; D) В объектив камеры\";D\nВыберите три вида движения камеры.;\"A) Панорама; B) Антракт; C) Наезд; D) Поклон; E) Отъезд\";\"A; C; E\"\nВыберите трех членов съемочной группы.;\"A) Суфлер; B) Оператор; C) Звукорежиссер; D) Капельдинер; E) Режиссер монтажа\";\"B; C; E\"\nВыберите три особенности игры актера на крупном плане.;\"A) Крупные жесты, рассчитанные на последний ряд зрительного зала; B) Сдержанная, экономная мимика; C) Громкая подача голоса, как в большом зале; D) Особое значение взгляда и работы глаз; E) Правда внутреннего состояния, которую камера «видит»\";\"B; D; E\"\nРасположите планы от самого общего к самому крупному.;\"1. Крупный план; 2. Общий план; 3. Деталь; 4. Средний план\";\"2; 4; 1; 3\"\nРасположите команды и действия во время съемки одного кадра в правильной последовательности.;\"1. Хлопушка; 2. «Стоп!»; 3. «Мотор!»; 4. «Начали!»\";\"3; 1; 4; 2\"\nРасположите этапы работы актера над ролью в кино в правильной последовательности.;\"1. Озвучание роли; 2. Кинопроба; 3. Съемочный период; 4. Утверждение на роль\";\"2; 4; 3; 1\"\nУстановите соответствие между понятиями (1–4) и их определениями (A–D).;\"1. Монтаж; 2. Хронометраж; 3. Титры; 4. Синопсис; A) Надписи на экране, например имена создателей фильма; B) Краткое изложение сюжета фильма; C) Соединение снятых фрагментов в единое целое; D) Продолжительность фильма или сцены\";\"1-C; 2-D; 3-A; 4-B\"\nУстановите соответствие между членами съемочной группы (1–4) и их обязанностями (A–D).;\"1. Режиссер; 2. Художник-постановщик; 3. Гример; 4. Кастинг-директор; A) Подбирает актеров на роли; B) Создает внешний облик персонажа: возраст, черты лица, прическу; C) Руководит творческим процессом и работой актеров; D) Отвечает за декорации и облик мира фильма\";\"1-C; 2-D; 3-B; 4-A\"\nУстановите соответствие между понятиями (1–4) и их значениями (A–D).;\"1. Метка; 2. Самопроба; 3. Шоурил; 4. Массовка; A) Люди, создающие фон в кадре, например прохожие или толпа; B) Знак на полу, показывающий, где актер должен остановиться в кадре; C) Короткий видеоролик с лучшими фрагментами ролей актера; D) Видеозапись пробы, которую актер делает сам и отправляет на кастинг\";\"1-B; 2-D; 3-C; 4-A\"\nКаким термином обозначается последовательность рисунков, на которых заранее изображены будущие кадры фильма?;;Раскадровка\nКаким термином обозначается каждая отдельная попытка съемки одного и того же кадра?;;Дубль\nКаким термином обозначается расположение актеров в кадре и их перемещения во время съемки сцены?;;Мизансцена|Мизанкадр\nКак называется явление, при котором зритель по-разному воспринимает одно и то же нейтральное лицо актера в зависимости от того, какой кадр смонтирован рядом с ним?;;Эффект Кулешова\nКак называется место, где непосредственно проходят съемки фильма, в павильоне или на натуре?;;Съемочная площадка\nКак называется воображаемая преграда между актером и зрителем, а в кино между актером и камерой, которую актер не нарушает, «не замечая» зрителя?;;Четвертая стена"},{"name":"Работа с голосом","theatre":true,"csv":"Q;Q_opt;Answer\nВ каком органе речевого аппарата находятся голосовые складки?;\"A) В трахее; B) В гортани; C) В ротовой полости; D) В легких\";B\nВ каком с 2-B; 3-D; 4-A\"\nУстановите соответствие между понятиями (1–4) и их определениями (A–D).;\"1. Пантомима; 2. Этюд; 3. Темпо-ритм; 4. Мизансцена; A) Расположение актеров на сцене в определенный момент действия; B) Искусство передачи мыслей и чувств без слов; C) Скорость и интенсивность действия; D) Короткая импровизационная сценка на заданную тему\";\"1-B; 2-D; 3-C; 4-A\"\nКаким термином в актерской практике обозначают лишнее, непроизвольное напряжение мышц, которое мешает свободе движения?;;Зажим\nКаким термином обозначается положение тела с округленной спиной, прижатым к груди подбородком и подтянутыми коленями, которое используется в акробатике, например при кувырках?;;Группировка\nКаким термином обозначается женский поклон с приседанием, который изучают на занятиях по сценическому этикету и историко-бытовому танцу?;;Реверанс\nКак называется точка, в которой условно сосредоточен вес тела и от положения которой зависит устойчивость позы?;;Центр тяжести\nКак называется выполняемый по особой технике и безопасный для актера прием, при котором персонаж на сцене оказывается на полу, например от «удара» или «обморока»?;;Сценическое падение\nКак называется прием М.А. Чехова: обобщенное выразительное движение всего тела, которое передает главное желание персонажа и помогает актеру найти образ?;;Психологический жест"},{"name":"Литература и драматургия","theatre":false,"csv":"Q;Q_opt;Answer\nИз обрядов в честь какого бога возникла древнегреческая трагедия?;\"A) Зевса; B) Посейдона; C) Ареса; D) Диониса\";D\nКак называется прием, которым пользуется Д.И. Фонвизин в комедии «Недоросль», давая персонажам имена Правдин, Стародум, Скотинин?;\"A) Говорящие фамилии; B) Внутренний монолог; C) Поток сознания; D) Реплика в сторону\";A\nКто из поэтов второй половины XX в. был актером Театра на Таганке и сыграл Гамлета в спектакле Ю.П. Любимова?;\"A) Б.Ш. Окуджава; B) В.Р. Цой; C) В.С. Высоцкий; D) И.А. Бродский\";C\nВыберите три черты классицизма.;\"A) Ориентация на античные образцы; B) Культ исключительной личности, бунтующей против общества; C) Строгое разделение жанров на высокие и низкие; D) Изображение «потока сознания» героя; E) Конфликт чувства и долга, в котором побеждает долг\";\"A; C; E\"\nВыберите три пьесы А.Н. Островского.;\"A) «Борис Годунов»; B) «Гроза»; C) «Бесприданница»; D) «Маскарад»; E) «Лес»\";\"B; C; E\"\nВыберите три пьесы, написанные в XX веке.;\"A) «Горе от ума»; B) «На дне»; C) «Ревизор»; D) «Дни Турбиных»; E) «Утиная охота»\";\"B; D; E\"\nРасположите драматургов в хронологическом порядке.;\"1. Мольер; 2. Шиллер; 3. Софокл; 4. Шекспир\";\"3; 4; 1; 2\"\nРасположите русских драматургов в хронологическом порядке.;\"1. Н.В. Гоголь; 2. А.П. Чехов; 3. А.Н. Островский; 4. Д.И. Фонвизин\";\"4; 1; 3; 2\"\nРасположите периоды и направления русской литературы XX в. в хронологическом порядке.;\"1. Литература «оттепели»; 2. Серебряный век; 3. Русский постмодернизм; 4. Социалистический реализм\";\"2; 4; 1; 3\"\nУстановите соответствие между авторами (1–4) и их произведениями (A–D).;\"1. Гомер; 2. Данте; 3. Сервантес; 4. Бомарше; A) «Дон Кихот»; B) «Женитьба Фигаро»; C) «Илиада»; D) «Божественная комедия»\";\"1-C; 2-D; 3-A; 4-B\"\nУстановите соответствие между драматургами (1–4) и их пьесами (A–D).;\"1. А.С. Грибоедов; 2. Н.В. Гоголь; 3. И.С. Тургенев; 4. А.П. Чехов; A) «Чайка»; B) «Горе от ума»; C) «Месяц в деревне»; D) «Ревизор»\";\"1-B; 2-D; 3-C; 4-A\"\nУстановите соответствие между поэтами (1–4) и литературными направлениями, с которыми связано их творчество (A–D).;\"1. А.А. Блок; 2. А.А. Ахматова; 3. В.В. Маяковский; 4. С.А. Есенин; A) Акмеизм; B) Футуризм; C) Имажинизм; D) Символизм\";\"1-D; 2-A; 3-B; 4-C\"\nКаким термином Аристотель в «Поэтике» обозначил очищение души зрителя через сострадание и страх, которое вызывает трагедия?;;Катарсис\nКаким термином обозначается литературное направление конца XVIII в., поставившее в центр внимания чувства и внутренний мир простого человека (например, повесть Н.М. Карамзина «Бедная Лиза»)?;;Сентиментализм\nКаким термином обозначается авторское пояснение в тексте пьесы, например указание в финале «Вишневого сада» А.П. Чехова на «отдаленный звук, точно с неба, звук лопнувшей струны»?;;Ремарка\nКак называется требование драматургии классицизма, согласно которому действие пьесы должно происходить в одном месте, укладываться в одни сутки и строиться вокруг одной сюжетной линии?;;Правило трех единств\nКак называется цикл пьес А.С. Пушкина, в который входят «Скупой рыцарь», «Моцарт и Сальери», «Каменный гость» и «Пир во время чумы»?;;Маленькие трагедии\nКак называется направление драматургии середины XX в., к которому относятся пьесы «В ожидании Годо» С. Беккета и «Лысая певица» Э. Ионеско?;;Театр абсурда"},{"name":"История искусств","theatre":false,"csv":"Q;Q_opt;Answer\nЧто характерно для изобразительного искусства Древнего Египта?;\"A) Свобода позы и отсутствие строгих правил; B) Следование строгим правилам изображения, неизменным на протяжении веков; C) Реалистичная передача объема и анатомии; D) Отказ от изображения человека\";B\nКакой стиль европейского искусства XVII в. отличается динамикой, театральностью и резкими контрастами света и тени?;\"A) Классицизм; B) Романтизм; C) Барокко; D) Импрессионизм\";C\nКакую главную задачу ставили перед собой художники-импрессионисты?;\"A) Передать историческую достоверность событий; B) Создать идеализированный образ действительности; C) Выразить религиозные и мистические переживания; D) Запечатлеть мимолетное впечатление от света и цвета в конкретный момент\";D\nВыберите три черты искусства Древней Греции.;\"A) Гармония и соразмерность; B) Плоскостность и условность изображения; C) Идеализация красоты человеческого тела; D) Стремление к случайности и спонтанности; E) Обращение к мифологическим сюжетам\";\"A; C; E\"\nВыберите три черты искусства эпохи Возрождения.;\"A) Отказ от изображения реального мира; B) Обращение к античному наследию; C) Подчинение изображения строгому церковному канону; D) Интерес к человеку, гуманизм; E) Использование линейной перспективы\";\"B; D; E\"\nВыберите три направления искусства начала XX века.;\"A) Кубизм; B) Классицизм; C) Романтизм; D) Футуризм; E) Сюрреализм\";\"A; D; E\"\nРасположите памятники в хронологическом порядке их создания.;\"1. Колизей; 2. Наскальная живопись первобытных людей; 3. Парфенон; 4. Пирамиды Гизы\";\"2; 4; 3; 1\"\nРасположите художественные стили в порядке их появления.;\"1. Барокко; 2. Рококо; 3. Романский стиль; 4. Возрождение\";\"3; 4; 1; 2\"\nРасположите направления искусства XIX–XX веков в порядке их возникновения.;\"1. Реализм; 2. Импрессионизм; 3. Поп-арт; 4. Романтизм\";\"4; 1; 2; 3\"\nУстановите соответствие между произведениями (1–4) и культурами, в которых они созданы (A–D).;\"1. Маска Тутанхамона; 2. Ника Самофракийская; 3. Фрески Помпей; 4. Терракотовая армия; A) Древний Китай; B) Древний Египет; C) Древний Рим; D) Древняя Греция\";\"1-B; 2-D; 3-C; 4-A\"\nУстановите соответствие между произведениями (1–4) и их авторами (A–D).;\"1. «Джоконда»; 2. «Сотворение Адама»; 3. «Сикстинская мадонна»; 4. «Троица»; A) Рафаэль; B) Леонардо да Винчи; C) Андрей Рублев; D) Микеланджело\";\"1-B; 2-D; 3-A; 4-C\"\nУстановите соответствие между картинами (1–4) и их авторами (A–D).;\"1. «Бурлаки на Волге»; 2. «Утро в сосновом лесу»; 3. «Богатыри»; 4. «Черный квадрат»; A) И.Е. Репин; B) К.С. Малевич; C) И.И. Шишкин; D) В.М. Васнецов\";\"1-A; 2-C; 3-D; 4-B\"\nКаким термином обозначается система пропорций и оформления колонн и перекрытий в античной архитектуре (дорический, ионический, коринфский)?;;Ордер\nКаким термином обозначается стиль средневекового искусства, для которого характерны устремленность ввысь, каркасная система и витражи?;;Готика\nКак называлось объединение русских художников-реалистов второй половины XIX в., которые устраивали выставки в разных городах России (И.Н. Крамской, В.И. Суриков, И.И. Левитан)?;;Передвижники\nКак называется монументальное сооружение, которое древние римляне возводили в честь военных побед и через которое торжественно проходили победители?;;Триумфальная арка\nКак называется прием построения пространства в древнерусской иконописи, при котором предметы не сужаются, а расширяются по мере удаления от зрителя?;;Обратная перспектива\nКак называется искусство, которое не изображает реальные предметы, а выражает идеи и чувства с помощью сочетаний линий, пятен и цвета?;;Абстрактное искусство|Абстракционизм"},{"name":"История России","theatre":false,"csv":"Q;Q_opt;Answer\nКакое значение для положения крестьян имело Соборное уложение 1649 г.?;\"A) Крестьяне получили личную свободу и земельные наделы; B) За крестьянами было закреплено право перехода к другому владельцу в Юрьев день; C) Был введен бессрочный сыск беглых крестьян, что означало окончательное оформление крепостного права; D) Крестьяне были освобождены от уплаты государственных податей\";C\nКакую главную внешнеполитическую задачу решила Россия в результате победы в Северной войне 1700–1721 гг.?;\"A) Присоединение Сибири; B) Получение выхода к Черному морю; C) Присоединение Средней Азии; D) Получение выхода к Балтийскому морю\";D\nКакое сражение положило начало коренному перелому в ходе Великой Отечественной войны?;\"A) Оборона Брестской крепости; B) Сталинградская битва; C) Битва за Москву; D) Берлинская операция\";B\nВыберите три явления, характерные для Смутного времени (начало XVII в.).;\"A) Введение опричнины; B) Появление самозванцев, претендовавших на царский престол; C) Иностранная интервенция со стороны Речи Посполитой и Швеции; D) Церковный раскол, вызванный реформами патриарха Никона; E) Создание народных ополчений для освобождения Москвы\";\"B; C; E\"\nВыберите три реформы, проведенные в царствование Александра II.;\"A) Отмена крепостного права; B) Судебная реформа, введение суда присяжных; C) Учреждение Сената и коллегий; D) Создание земств, выборных органов местного самоуправления; E) Издание Жалованной грамоты дворянству\";\"A; B; D\"\nВыберите три итога Первой русской революции 1905–1907 гг.;\"A) Учреждение Государственной думы; B) Свержение монархии и провозглашение республики; C) Провозглашение гражданских свобод Манифестом 17 октября 1905 г.; D) Становление многопартийной системы; E) Национализация крупной промышленности\";\"A; C; D\"\nРасположите этапы развития русской государственности в хронологическом порядке.;\"1. Установление зависимости русских земель от Золотой Орды; 2. Образование единого Русского государства с центром в Москве; 3. Образование государства Русь с центром в Киеве; 4. Распад Руси на ряд самостоятельных земель и княжеств\";\"3; 4; 1; 2\"\nРасположите события истории России XVIII–XIX вв. в хронологическом порядке.;\"1. Восстание декабристов на Сенатской площади; 2. Провозглашение России империей; 3. Крымская война; 4. Восстание под предводительством Емельяна Пугачева\";\"2; 4; 1; 3\"\nРасположите события истории России XX в. в хронологическом порядке.;\"1. Образование СССР; 2. Распад СССР; 3. Октябрьская революция и приход к власти большевиков; 4. Полет Ю.А. Гагарина в космос\";\"3; 1; 4; 2\"\nУстановите соответствие между историческими деятелями (1–4) и событиями, с которыми связана их деятельность (A–D).;\"1. Ярослав Мудрый; 2. Александр Невский; 3. Дмитрий Донской; 4. Иван IV Грозный; A) Куликовская битва; B) Венчание на царство и принятие царского титула; C) Создание свода законов «Русская правда»; D) Ледовое побоище\";\"1-C; 2-D; 3-A; 4-B\"\nУстановите соответствие между направлениями общественной мысли и общественного движения XIX в. (1–4) и их основными идеями (A–D).;\"1. Декабристы; 2. Славянофилы; 3. Западники; 4. Народники; A) Самобытный путь развития России, основанный на православии и традициях допетровской Руси; B) Развитие России по пути стран Западной Европы; C) «Хождение в народ», идея крестьянского социализма; D) Ограничение или упразднение самодержавия и отмена крепостного права путем военного выступления\";\"1-D; 2-A; 3-B; 4-C\"\nУстановите соответствие между руководителями Советского государства (1–4) и политикой, проводившейся в период их руководства (A–D).;\"1. В.И. Ленин; 2. И.В. Сталин; 3. Н.С. Хрущев; 4. М.С. Горбачев; A) Перестройка; B) Новая экономическая политика; C) «Оттепель»; D) Сплошная коллективизация сельского хозяйства\";\"1-B; 2-D; 3-C; 4-A\"\nВ каком году произошло Крещение Руси при князе Владимире Святославиче?;;988\nВ каком году произошла Отечественная война, завершившаяся изгнанием армии Наполеона из России?;;1812\nКаким термином обозначается политика ускоренного создания крупной, прежде всего тяжелой, промышленности, проводившаяся в СССР в годы первых пятилеток?;;Индустриализация\nКак назывался сословно-представительный орган Русского государства XVI–XVII вв., который, в частности, в 1613 г. избрал на царство Михаила Романова?;;Земский собор\nКак называется политика Екатерины II, сочетавшая укрепление неограниченной власти монарха с преобразованиями в духе идей европейских философов XVIII в.?;;Просвещенный абсолютизм\nКак называется глобальное противостояние СССР и США и их союзников во второй половине XX в., которое сопровождалось гонкой вооружений, но не переросло в прямое военное столкновение между ними?;;Холодная война"},{"name":"ОРГ","theatre":false,"csv":"Q;Q_opt;Answer\nКакая горная система традиционно считается границей между европейской и азиатской частями России?;\"A) Хибины; B) Уральские горы; C) Алтай; D) Саяны\";B\nКакой язык является государственным языком Российской Федерации на всей ее территории?;\"A) Английский язык; B) Церковнославянский язык; C) Государственный язык Конституцией не установлен; D) Русский язык\";D\nКак статья 1 Конституции Российской Федерации определяет Россию?;\"A) Унитарное государство с монархической формой правления; B) Конфедерация суверенных республик; C) Демократическое федеративное правовое государство с республиканской формой правления; D) Федеративное государство с монархической формой правления\";C\nВыберите три океана, к бассейнам которых относятся моря, омывающие берега России.;\"A) Индийский океан; B) Северный Ледовитый океан; C) Тихий океан; D) Южный океан; E) Атлантический океан\";\"B; C; E\"\nВыберите три показателя, которые используются для характеристики демографической ситуации в России.;\"A) Уровень инфляции; B) Рождаемость; C) Объем экспорта; D) Смертность; E) Миграционный прирост\";\"B; D; E\"\nВыберите три ветви, на которые, согласно Конституции Российской Федерации, разделяется государственная власть.;\"A) Законодательная; B) Избирательная; C) Исполнительная; D) Судебная; E) Информационная\";\"A; C; D\"\nРасположите города России в направлении с запада на восток.;\"1. Москва; 2. Владивосток; 3. Калининград; 4. Новосибирск\";\"3; 1; 4; 2\"\nРасположите государственные праздники России в порядке их следования в календарном году.;\"1. День народного единства; 2. Праздник Весны и Труда; 3. Международный женский день; 4. День России\";\"3; 2; 4; 1\"\nРасположите основные стадии принятия федерального закона в правильной последовательности.;\"1. Одобрение закона Советом Федерации; 2. Внесение законопроекта в Государственную Думу; 3. Подписание и обнародование закона Президентом Российской Федерации; 4. Принятие закона Государственной Думой\";\"2; 4; 1; 3\"\nУстановите соответствие между природными объектами России (1–4) и их характеристиками (A–D).;\"1. Байкал; 2. Эльбрус; 3. Волга; 4. Камчатка; A) Полуостров с многочисленными действующими вулканами; B) Самое глубокое озеро на планете; C) Самая длинная река Европы; D) Высочайшая вершина России\";\"1-B; 2-D; 3-C; 4-A\"\nУстановите соответствие между понятиями (1–4) и их определениями (A–D).;\"1. Гражданство; 2. Семья; 3. Волонтерство; 4. Перепись населения; A) Сбор сведений о численности и составе населения страны; B) Безвозмездная деятельность граждан на благо общества; C) Устойчивая правовая связь человека с государством, выражающаяся в совокупности их взаимных прав и обязанностей; D) Малая социальная группа, основанная на браке или родстве\";\"1-C; 2-D; 3-B; 4-A\"\nУстановите соответствие между орган нением?;\"A) Этот фильм лучший в истории кино; B) Вода кипит при температуре 100 градусов Цельсия и нормальном атмосферном давлении; C) Летом отдыхать интереснее, чем зимой; D) Классическая музыка приятнее современной\";B\nВыберите три вида умозаключений.;\"A) Запоминание; B) Дедукция; C) Индукция; D) Внушение; E) Аналогия\";\"B; C; E\"\nВыберите три правила, которые помогают вести спор корректно.;\"A) Опираться на проверенные факты; B) Повышать голос, чтобы убедить собеседника; C) Внимательно выслушивать собеседника до конца; D) Прибегать к угрозам, когда закончились доводы; E) Четко определять предмет спора и не менять его в ходе обсуждения\";\"A; C; E\"\nВыберите три признака, которые должны насторожить при оценке достоверности сообщения в интернете.;\"A) Отсутствие ссылки на источник информации; B) Кричащий, эмоциональный заголовок; C) Указание автора и даты публикации; D) Призыв срочно переслать сообщение всем знакомым; E) Подтверждение сведений несколькими независимыми источниками\";\"A; B; D\"\nРасположите этапы научного исследования в правильной последовательности.;\"1. Формулирование вывода; 2. Наблюдение и постановка вопроса; 3. Проверка гипотезы с помощью эксперимента; 4. Выдвижение гипотезы\";\"2; 4; 3; 1\"\nРасположите части убедительного выступления в правильном порядке.;\"1. Доводы и примеры в поддержку главной мысли; 2. Итог и вывод; 3. Вступление, обозначающее тему выступления; 4. Главная мысль, которую нужно доказать\";\"3; 4; 1; 2\"\nРасположите этапы работы с информацией при подготовке доклада в правильной последовательности.;\"1. Отбор надежных источников с проверкой их достоверности; 2. Формулирование выводов и оформление результата; 3. Анализ и сопоставление собранных данных; 4. Поиск источников информации по теме\";\"4; 1; 3; 2\"\nУстановите соответствие между законами логики (1–4) и их формулировками (A–D).;\"1. Закон тождества; 2. Закон непротиворечия; 3. Закон исключенного третьего; 4. Закон достаточного основания; A) Всякая мысль должна быть обоснована; B) Каждое понятие в ходе рассуждения должно сохранять один и тот же смысл; C) Из двух противоречащих друг другу утверждений одно обязательно истинно, третьего не дано; D) Два несовместимых утверждения об одном и том же не могут быть одновременно истинными\";\"1-B; 2-D; 3-C; 4-A\"\nУстановите соответствие между логическими ошибками (1–4) и примерами (A–D).;\"1. Поспешное обобщение; 2. После этого, значит, вследствие этого; 3. Порочный круг; 4. Скользкая дорожка; A) «Я прочитал две книги этого жанра, и обе оказались скучными, значит, все книги этого жанра скучные»; B) «Если разрешить один раз опоздать на занятие, скоро все студенты перестанут ходить на учебу»; C) «Я надел новый свитер, и наша команда выиграла, значит, свитер приносит удачу»; D) «Эта книга говорит правду, потому что в ней написано, что все в ней правда»\";\"1-A; 2-C; 3-D; 4-B\"\nУстановите соответствие между психологическими эффектами (1–4) и их описаниями (A–D).;\"1. Предвзятость подтверждения; 2. Эффект ореола; 3. Эффект якоря; 4. Эффект присоединения к большинству; A) Перенос общего впечатления о человеке, например о его внешности, на оценку других его качеств; B) Зависимость оценки от первого услышанного числа, например от первоначально названной цены; C) Склонность замечать только ту информацию, которая подтверждает уже имеющееся мнение; D) Склонность думать и поступать так, как большинство окружающих\";\"1-C; 2-A; 3-B; 4-D\"\nКаким термином обозначается пример, который опровергает общее утверждение (например, черный лебедь для утверждения «все лебеди белые»)?;;Контрпример\nКаким термином обозначается главная мысль, которую нужно доказать в ходе аргументации?;;Тезис\nКаким термином обозначается исходный документ или сообщение, в котором сведения были опубликованы впервые?;;Первоисточник\nКак называется связь между явлениями, при которой одно явление порождает другое?;;Причинно-следственная связь\nКак называется логическая ошибка, при которой из многих возможных вариантов искусствен <script id="core">
/* Pure logic, no DOM: CSV parsing, marking, test assembly. */
(function (root) {
  'use strict';

  var TYPES = ['single', 'multi', 'order', 'match', 'short'];
  var DEFAULT_MOCK = { total: 40, theatreShare: 0.5,
    types: { single: 0.1, multi: 0.1, order: 0.1, match: 0.1, short: 0.6 } };
  // Cyrillic letters that look Latin, and the reverse: teachers often type them by accident in Excel.
  var LAT_FROM_CYR = { 'А': 'A', 'В': 'B', 'С': 'C', 'Е': 'E', 'Н': 'H', 'К': 'K', 'М': 'M', 'О': 'O', 'Р': 'P', 'Т': 'T', 'Х': 'X' };
  var CYR_FROM_LAT = { 'A': 'А', 'B': 'В', 'C': 'С', 'E': 'Е', 'H': 'Н', 'K': 'К', 'M': 'М', 'O': 'О', 'P': 'Р', 'T': 'Т', 'X': 'Х' };

  function clean(s) {
    return String(s === null || s === undefined ? '' : s).normalize('NFC')
      .replace(/[     ]/g, ' ')
      .replace(/[­​‌‍⁠﻿]/g, '')
      .replace(/\s+/g, ' ').trim();
  }

  function parseCSVText(text) {
    text = String(text || '').replace(/^﻿/, '');
    var firstLine = text.split(/\r?\n/, 1)[0] || '';
    var delim = firstLine.split(';').length >= firstLine.split(',').length ? ';' : ',';
    var rows = [], row = [], field = '', inQ = false, line = 1, rowLine = 1, i = 0, c;
    while (i < text.length) {
      c = text.charAt(i);
      if (inQ) {
        if (c === '"') {
          if (text.charAt(i + 1) === '"') { field += '"'; i += 2; continue; }
          inQ = false; i++; continue;
        }
        if (c === '\n') line++;
        field += c; i++; continue;
      }
      if (c === '"' && field === '') { inQ = true; i++; continue; }
      if (c === delim) { row.push(field); field = ''; i++; continue; }
      if (c === '\r') { i++; continue; }
      if (c === '\n') {
        row.push(field); row.line = rowLine; rows.push(row);
        row = []; field = ''; line++; rowLine = line; i++; continue;
      }
      field += c; i++;
    }
    if (field !== '' || row.length) { row.push(field); row.line = rowLine; rows.push(row); }
    return rows.filter(function (r) { return r.some(function (x) { return x.trim() !== ''; }); });
  }

  function mapHeader(cells) {
    var names = cells.map(function (x) { return clean(x).toLowerCase(); });
    function find(list) {
      for (var k = 0; k < names.length; k++) if (list.indexOf(names[k]) !== -1) return k;
      return -1;
    }
    return {
      q: find(['q', 'question', 'вопрос']),
      o: find(['q_opt', 'opt', 'options', 'варианты']),
      a: find(['answer', 'key', 'ответ', 'ключ'])
    };
  }

  // Splits "A) ...; B) ..." or "1. ...; 2. ..." into labelled parts. Returns null if unlabelled.
  function splitLabeled(s) {
    var re = /(^|;)\s*(\d{1,2}|[A-Za-zА-ЯЁа-яё])\s*[.)]\s*/g, marks = [], m;
    while ((m = re.exec(s)) !== null) {
      marks.push({ label: m[2], start: m.index + m[1].length, textStart: re.lastIndex });
    }
    if (!marks.length || clean(s.slice(0, marks[0].start)) !== '') return null;
    var parts = [];
    for (var i = 0; i < marks.length; i++) {
      var end = i + 1 < marks.length ? marks[i + 1].start : s.length;
      parts.push({ label: marks[i].label, text: clean(s.slice(marks[i].textStart, end).replace(/;\s*$/, '')) });
    }
    return parts;
  }

  function schemeOf(labels) {
    return labels.some(function (l) { return /^[БГДЖЗбгджз]$/.test(l); }) ? 'ru' : 'lat';
  }
  function normLetter(ch, scheme) {
    ch = String(ch).toUpperCase();
    return scheme === 'ru' ? (CYR_FROM_LAT[ch] || ch) : (LAT_FROM_CYR[ch] || ch);
  }
  function fail(msg) { throw new Error(msg); }

  function parseRow(qRaw, optRaw, ansRaw) {
    var q = clean(qRaw), opt = clean(optRaw), ans = clean(ansRaw);
    if (!q) fail('нет текста вопроса');
    if (!ans) fail('нет ответа');

    if (!opt) {
      var alts = ans.split('|').map(clean).filter(Boolean);
      if (!alts.length) fail('нет ответа');
      return { type: 'short', q: q, answers: alts };
    }

    var parts = splitLabeled(opt);
    if (!parts) {
      parts = opt.split(';').map(clean).filter(Boolean)
        .map(function (t, k) { return { label: 'ABCDEFGHIJ'.charAt(k), text: t }; });
    }
    var nums = parts.filter(function (p) { return /^\d+$/.test(p.label); });
    var lets = parts.filter(function (p) { return !/^\d+$/.test(p.label); });
    var scheme = schemeOf(lets.map(function (p) { return p.label; }));
    var numIdx = {}, letIdx = {};
    nums.forEach(function (p, k) {
      if (numIdx[String(+p.label)] !== undefined) fail('номер ' + p.label + ' повторяется в вариантах');
      numIdx[String(+p.label)] = k;
    });
    lets.forEach(function (p, k) {
      var L = normLetter(p.label, scheme);
      if (letIdx[L] !== undefined) fail('буква ' + p.label + ' повторяется в вариантах');
      letIdx[L] = k;
    });
    if (parts.some(function (p) { return !p.text; })) fail('есть пустой вариант');

    if (nums.length && lets.length) {
      var key = nums.map(function () { return -1; });
      var re = /(\d+)\s*[-–—−=:>→]*\s*([A-Za-zА-ЯЁа-яё])/g, m;
      while ((m = re.exec(ans)) !== null) {
        var li = numIdx[String(+m[1])], ri = letIdx[normLetter(m[2], scheme)];
        if (li === undefined) fail('в ключе номер ' + m[1] + ', которого нет среди вариантов');
        if (ri === undefined) fail('в ключе буква ' + m[2] + ', которой нет среди вариантов');
        if (key[li] !== -1) fail('номер ' + m[1] + ' встречается в ключе дважды');
        key[li] = ri;
      }
      if (key.indexOf(-1) !== -1) fail('в ключе соответствия указаны не все номера');
      return { type: 'match', q: q,
        left: nums.map(function (p) { return p.text; }),
        right: lets.map(function (p) { return p.text; }), key: key };
    }

    if (nums.length) {
      var toks = ans.match(/\d+/g) || [];
      if (toks.length === 1 && toks[0].length === nums.length && nums.length < 10) toks = toks[0].split('');
      if (toks.length !== nums.length) fail('в ключе ' + toks.length + ' номеров, а элементов ' + nums.length);
      var okey = toks.map(function (t) {
        var k = numIdx[String(+t)];
        if (k === undefined) fail('в ключе номер ' + t + ', которого нет среди элементов');
        return k;
      });
      if (okey.some(function (v, k) { return okey.indexOf(v) !== k; })) fail('номер повторяется в ключе');
      return { type: 'order', q: q, items: nums.map(function (p) { return p.text; }), key: okey };
    }

    if (lets.length < 2) fail('меньше двух вариантов ответа');
    var lt = ans.replace(/[().]/g, ' ').split(/[\s;,]+/).filter(Boolean);
    if (lt.length === 1 && lt[0].length > 1 && lt[0].length <= lets.length) lt = lt[0].split('');
    var ckey = lt.map(function (t) {
      if (t.length !== 1) fail('ключ «' + t + '» не похож на букву варианта');
      var k = letIdx[normLetter(t, scheme)];
      if (k === undefined) fail('в ключе буква ' + t + ', которой нет среди вариантов');
      return k;
    });
    if (ckey.some(function (v, k) { return ckey.indexOf(v) !== k; })) fail('буква повторяется в ключе');
    var options = lets.map(function (p) { return p.text; });
    if (ckey.length === 1) return { type: 'single', q: q, options: options, key: ckey[0] };
    return { type: 'multi', q: q, options: options, key: ckey.slice().sort(function (a, b) { return a - b; }) };
  }

  function hash(str) {
    var h = 0x811c9dc5;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return (h >>> 0).toString(36);
  }

  function parseSubject(name, text) {
    var out = { name: name, questions: [], errors: [] };
    var rows = parseCSVText(String(text || '').normalize('NFC'));
    if (!rows.length) { out.errors.push('файл пустой'); return out; }
    var hd = mapHeader(rows[0]);
    if (hd.q < 0 || hd.a < 0) { out.errors.push('в первой строке нет заголовков Q и Answer'); return out; }
    var seen = {};
    for (var k = 1; k < rows.length; k++) {
      var r = rows[k], opt = hd.o >= 0 ? r[hd.o] : '';
      try {
        var q = parseRow(r[hd.q], opt, r[hd.a]);
        var base = 'q' + hash(name + '\u0001' + q.q + '\u0001' + clean(opt)), id = base, n = 2;
        while (seen[id]) id = base + '-' + (n++);
        seen[id] = true;
        q.id = id; q.subject = name; q.line = r.line;
        out.questions.push(q);
      } catch (e) {
        out.errors.push('строка ' + r.line + ': ' + (e && e.message ? e.message : String(e)));
      }
    }
    return out;
  }

  // Typed answers: wording must match; case, spacing, ё/е, quotes, dash style and a final full stop don't count.
  function normAnswer(s) {
    return String(s === null || s === undefined ? '' : s).normalize('NFC').toLowerCase()
      .replace(/ё/g, 'е')
      .replace(/[­​‌‍⁠﻿]/g, '')
      .replace(/[‐-―−]/g, '-')
      .replace(/[«»„“”"'’‘`]/g, '')
      .replace(/\s+/g, ' ').trim()
      .replace(/\s*-\s*/g, '-')
      .replace(/[.,!?;:…]+$/, '').trim();
  }

  function emptyResponse(q) {
    if (q.type === 'single') return -1;
    if (q.type === 'multi' || q.type === 'order') return [];
    if (q.type === 'match') return q.left.map(function () { return -1; });
    return '';
  }
  function isComplete(q, r) {
    if (r === null || r === undefined) return false;
    if (q.type === 'single') return r >= 0;
    if (q.type === 'multi') return r.length === q.key.length;
    if (q.type === 'order') return r.length === q.items.length;
    if (q.type === 'match') return r.length === q.left.length && r.every(function (x) { return x >= 0; });
    return normAnswer(r) !== '';
  }
  function isCorrect(q, r) {
    if (r === null || r === undefined) return false;
    switch (q.type) {
      case 'single': return r === q.key;
      case 'multi': return Array.isArray(r) && r.length === q.key.length &&
        q.key.every(function (k) { return r.indexOf(k) !== -1; });
      case 'order': return Array.isArray(r) && r.length === q.key.length &&
        r.every(function (v, k) { return v === q.key[k]; });
      case 'match': return Array.isArray(r) && r.length === q.key.length &&
        r.every(function (v, k) { return v === q.key[k]; });
      default: {
        var n = normAnswer(r);
        return n !== '' && q.answers.some(function (a) { return normAnswer(a) === n; });
      }
    }
  }

  function range(n) { var a = []; for (var i = 0; i < n; i++) a.push(i); return a; }
  function shuffle(a, rand) {
    rand = rand || Math.random;
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rand() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // Display order for one question; keeps a sequence item list from starting out already solved.
  function makeView(q, rand) {
    if (q.type === 'single' || q.type === 'multi') return { opt: shuffle(range(q.options.length), rand) };
    if (q.type === 'order') {
      var v = shuffle(range(q.items.length), rand), tries = 0;
      while (tries++ < 20 && v.length > 1 && v.every(function (x, k) { return x === q.key[k]; })) v = shuffle(v, rand);
      return { items: v };
    }
    if (q.type === 'match') return { right: shuffle(range(q.right.length), rand) };
    return {};
  }

  // Largest-remainder split of n questions across types.
  function quotas(n, shares) {
    var keys = TYPES.filter(function (t) { return shares[t] > 0; });
    var sum = keys.reduce(function (a, t) { return a + shares[t]; }, 0);
    var out = {}, used = 0;
    TYPES.forEach(function (t) { out[t] = 0; });
    if (!keys.length || n <= 0) return out;
    var raw = keys.map(function (t) { return { t: t, v: n * shares[t] / sum }; });
    raw.forEach(function (x) { out[x.t] = Math.floor(x.v); used += out[x.t]; });
    raw.sort(function (a, b) { return (b.v - Math.floor(b.v)) - (a.v - Math.floor(a.v)); });
    for (var i = 0; used < n; i = (i + 1) % raw.length) { out[raw[i].t]++; used++; }
    return out;
  }

  // Mock test: theatre half and other half, each split by type; grouped by type like a paper test.
  function buildMock(questions, theatreNames, cfg, rand) {
    cfg = cfg || DEFAULT_MOCK;
    var th = {}; (theatreNames || []).forEach(function (n) { th[n] = true; });
    var pools = { theatre: {}, other: {} };
    TYPES.forEach(function (t) { pools.theatre[t] = []; pools.other[t] = []; });
    questions.forEach(function (q) { pools[th[q.subject] ? 'theatre' : 'other'][q.type].push(q); });
    TYPES.forEach(function (t) { shuffle(pools.theatre[t], rand); shuffle(pools.other[t], rand); });
    var nTh = Math.round(cfg.total * cfg.theatreShare);
    var plan = [['theatre', nTh], ['other', cfg.total - nTh]];
    var picked = [], short = [];
    plan.forEach(function (p) {
      var q = quotas(p[1], cfg.types);
      TYPES.forEach(function (t) {
        var need = q[t];
        while (need > 0 && pools[p[0]][t].length) { picked.push(pools[p[0]][t].pop()); need--; }
        if (need > 0) short.push({ half: p[0], t: t, need: need });
      });
    });
    var missing = 0;
    short.forEach(function (s) {
      var other = s.half === 'theatre' ? 'other' : 'theatre';

      if (rec) {
        if (inKey && sel) { cls += ' is-ok'; tag = 'Верно'; }
        else if (inKey) { cls += ' is-missed'; tag = 'Нужно было выбрать'; }
        else if (sel) { cls += ' is-bad'; tag = 'Лишний вариант'; }
      }
      var b = optButton(cls, 'checkbox', sel, rec, q.options[oi], tag);
      if (!rec) b.addEventListener('click', function () {
        var p = state.r.indexOf(oi);
        if (p === -1) state.r.push(oi); else state.r.splice(p, 1);
        sync(); onChange();
      });
      box.appendChild(b);
      return b;
    });
    function sync() { btns.forEach(function (b, k) { b.setAttribute('aria-checked', String(state.r.indexOf(view.opt[k]) !== -1)); }); }
    return box;
  }

  function wOrder(q, view, state, rec, onChange) {
    var box = h('div', { class: 'opts is-order', role: 'group', 'aria-labelledby': 'qtext' });
    var items = view.items.map(function (ii) {
      var cls = 'opt', tag = null;
      if (rec) {
        var pos = state.r.indexOf(ii), want = q.key.indexOf(ii);
        if (pos === want) cls += ' is-ok';
        else { cls += pos === -1 ? ' is-missed' : ' is-bad'; tag = 'Верный номер: ' + (want + 1); }
      }
      var b = optButton(cls, null, false, rec, q.items[ii], tag);
      if (!rec) b.addEventListener('click', function () {
        var p = state.r.indexOf(ii);
        if (p === -1) state.r.push(ii); else state.r.splice(p, 1);
        sync(); onChange();
      });
      box.appendChild(b);
      return { b: b, ii: ii, num: b.querySelector('.mk') };
    });
    function sync() {
      items.forEach(function (it) {
        var p = state.r.indexOf(it.ii);
        it.num.textContent = p === -1 ? '' : String(p + 1);
        it.b.setAttribute('aria-pressed', String(p !== -1));
        it.b.setAttribute('aria-label', (p === -1 ? 'Без номера: ' : 'Номер ' + (p + 1) + ': ') + q.items[it.ii]);
      });
    }
    sync();
    var wrap = h('div', null, box);
    if (!rec) wrap.appendChild(h('button', { type: 'button', class: 'linkbtn', onclick: function () {
      state.r.length = 0; sync(); onChange();
    } }, 'Сбросить порядок'));
    return wrap;
  }

  function wMatch(q, view, state, rec, onChange) {
    var LET = 'ABCDEFGHIJ';
    var el = h('div', { class: 'match' },
      h('ol', { class: 'defs', 'aria-label': 'Варианты' }, view.right.map(function (ri, j) {
        return h('li', null, h('b', null, LET.charAt(j)), h('span', null, q.right[ri]));
      })));
    var rows = q.left.map(function (text, li) {
      var picked = state.r[li], want = q.key[li], ok = picked === want;
      var row = h('div', { class: 'mrow' },
        h('p', { class: 'mleft', id: 'ml' + li }, h('b', null, String(li + 1)), h('span', null, text)));
      var grid = h('div', { class: 'letters', role: 'radiogroup', 'aria-labelledby': 'ml' + li,
        style: 'grid-template-columns:repeat(' + view.right.length + ',minmax(0,1fr))' });
      var bs = view.right.map(function (ri, j) {
        var cls = null;
        if (rec) { if (ri === picked) cls = ok ? 'is-ok' : 'is-bad'; else if (ri === want && !ok) cls = 'is-missed'; }
        var b = h('button', { type: 'button', class: cls, role: 'radio', 'aria-checked': String(picked === ri),
          'aria-label': LET.charAt(j) + ': ' + q.right[ri], 'aria-disabled': rec ? 'true' : null }, LET.charAt(j));
        if (!rec) b.addEventListener('click', function () {
          state.r[li] = state.r[li] === ri ? -1 : ri; sync(); onChange();
        });
        grid.appendChild(b);
        return { b: b, ri: ri };
      });
      row.appendChild(grid);
      if (rec && !ok) row.appendChild(h('p', { class: 'mnote' }, 'Верно: ' + LET.charAt(view.right.indexOf(want))));
      el.appendChild(row);
      return { li: li, bs: bs };
    });
    function sync() {
      rows.forEach(function (r) { r.bs.forEach(function (x) { x.b.setAttribute('aria-checked', String(state.r[r.li] === x.ri)); }); });
    }
    return el;
  }

  function wShort(q, state, rec, onChange, onEnter) {
    var inp = h('input', { type: 'text', class: 'text-in' + (rec ? (rec.ok ? ' is-ok' : ' is-bad') : ''),
      autocomplete: 'off', autocorrect: 'off', autocapitalize: 'sentences', spellcheck: 'false',
      enterkeyhint: 'done', 'aria-labelledby': 'qtext',
      placeholder: rec ? (rec.skip ? 'Пропущено' : '') : 'Ваш ответ' });
    inp.value = typeof state.r === 'string' ? state.r : '';
    if (rec) inp.readOnly = true;
    else {
      inp.addEventListener('input', function () { state.r = inp.value; onChange(); });
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); onEnter(); } });
    }
    return inp;
  }

  /* ---------- Results ---------- */
  function renderResults() {
    S.screen = 'results';
    var s = S.session, qs = s.ids.map(function (id) { return S.byId[id]; }), n = qs.length;
    var okN = s.answers.filter(function (a) { return a && a.ok; }).length;
    var mins = Math.max(1, Math.round((s.finished - s.started) / 60000));
    var root = h('main', { class: 'wrap' });
    root.appendChild(h('header', { class: 'res-head' },
      h('h1', null, MODE_LABEL[s.mode] + ': результат'),
      h('p', { class: 'score' }, String(okN), h('small', null, ' из ' + n)),
      h('p', { class: 'res-sub' }, Math.round(100 * okN / n) + '% верных ответов. Время: ' + mins + ' мин.')));

    function tally(pred) {
      var t = { ok: 0, n: 0 };
      qs.forEach(function (q, k) { if (pred(q)) { t.n++; if (s.answers[k] && s.answers[k].ok) t.ok++; } });
      return t;
    }
    function block(title, groups) {
      groups = groups.filter(function (g) { return g.n; });
      var weak = null;
      if (groups.length > 1) {
        weak = groups.reduce(function (a, b) { return b.ok / b.n < a.ok / a.n ? b : a; });
        if (weak.ok === weak.n) weak = null;
      }
      return h('section', { class: 'brk' },
        h('h2', null, title),
        weak ? h('p', { class: 'lead' }, 'Слабое место: ', h('b', null, weak.label.toLowerCase()), ' (' + weak.ok + ' из ' + weak.n + ').') : null,
        h('div', { class: 'brows' }, groups.map(function (g) {
          return h('div', { class: 'brow' + (g === weak ? ' weak' : '') },
            h('span', null, g.label), h('span', { class: 'n' }, g.ok + ' из ' + g.n),
            h('span', { class: 'track', 'aria-hidden': 'true' }, h('i', { style: 'width:' + (100 * g.ok / g.n).toFixed(1) + '%' })));
        })));
    }
    root.appendChild(block('По типам вопросов', C.TYPES.map(function (t) {
      var x = tally(function (q) { return q.type === t; }); x.label = TYPE_LABEL[t]; return x;
    })));
    var th = theatreNames();
    if (s.mode === 'mock') {
      root.appendChild(block('По блокам', [
        (function () { var x = tally(function (q) { return th.indexOf(q.subject) !== -1; }); x.label = 'Театральный блок'; return x; })(),
        (function () { var x = tally(function (q) { return th.indexOf(q.subject) === -1; }); x.label = 'Другие предметы'; return x; })()
      ]));
    } else {
      root.appendChild(block('По предметам', S.subjects.map(function (sub) {
        var x = tally(function (q) { return q.subject === sub.name; }); x.label = sub.name; return x;
      })));
    }

    var wrong = [];
    qs.forEach(function (q, k) { if (!s.answers[k] || !s.answers[k].ok) wrong.push({ q: q, a: s.answers[k] }); });
    var mist = h('section', { class: 'mist' }, h('h2', null, wrong.length ? 'Ошибки: ' + wrong.length : 'Ошибок нет'));
    if (!wrong.length) mist.appendChild(h('p', { class: 'none' }, 'Все ответы верные.'));
    wrong.forEach(function (x) {
      mist.appendChild(h('div', { class: 'mitem' },
        h('p', { class: 'ms' }, x.q.subject),
        h('p', { class: 'mq' }, x.q.q),
        h('dl', null,
          h('dt', null, 'Ваш ответ'), h('dd', { class: 'y' }, C.respText(x.q, x.a ? x.a.r : null)),
          h('dt', null, 'Правильно'), h('dd', { class: 'c' }, C.keyText(x.q)))));
    });
    root.appendChild(mist);

    root.appendChild(h('div', { class: 'res-actions' },
      wrong.length ? h('button', { type: 'button', class: 'btn', onclick: function () {
        startSession('redo', C.shuffle(wrong.map(function (x) { return x.q; })));
      } }, 'Повторить ошибки: ' + wrong.length) : null,
      h('button', { type: 'button', class: 'btn btn-quiet', onclick: exitHome }, 'На главную')));
    mount(root, false);
  }

  /* ---------- Teacher ---------- */
  function readFileText(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onerror = function () { reject(fr.error || new Error('файл не читается')); };
      fr.onload = function () {
        var text;
        // Excel on Russian Windows saves CSV in Windows-1251; "CSV UTF-8" saves UTF-8.
        try { text = new TextDecoder('utf-8', { fatal: true }).decode(fr.result); }
        catch (e) { text = new TextDecoder('windows-1251').decode(fr.result); }
        resolve(text.replace(/^﻿/, '').normalize('NFC'));
      };
      fr.readAsArrayBuffer(file);
    });
  }

  function typeSummary(qs) {
    var cnt = {};
    qs.forEach(function (q) { cnt[q.type] = (cnt[q.type] || 0) + 1; });
    return C.TYPES.filter(function (t) { return cnt[t]; })
      .map(function (t) { return TYPE_LABEL[t].toLowerCase() + ': ' + cnt[t]; }).join(', ');
  }

  function renderTeacher() {
    S.screen = 'teacher';
    var root = h('main', { class: 'wrap' });
    root.appendChild(h('button', { type: 'button', class: 'linkbtn', onclick: renderHome }, 'На главную'));
    root.appendChild(h('header', { class: 'mast' },
      h('h1', null, 'Для преподавателя'),
      h('p', null, 'Сейчас в тренажёре ' + nq(S.questions.length) + ' ' + fromSubjects(S.subjects.length) + '.')));
    if (S.msg) { root.appendChild(h('p', { class: 't-msg', role: 'status' }, S.msg)); S.msg = ''; }

    var checks = h('div', { class: 'checks' });
    S.subjects.forEach(function (sub, k) {
      var cb = h('input', { type: 'checkbox' });
      cb.checked = sub.theatre;
      cb.addEventListener('change', function () { setTheatre(k, cb.checked); });
      checks.appendChild(h('label', { class: 'check' }, cb, h('span', null, sub.name), h('small', null, nq(sub.questions.length))));
      if (sub.errors.length) checks.appendChild(h('p', { class: 'rep-err' }, 'Ошибки в файле: ' + sub.errors.join('; ')));
    });
    root.appendChild(h('section', { class: 't-sec' },
      h('h2', null, 'Театральный блок'),
      h('p', null, 'Пробный тест берёт половину вопросов из отмеченных предметов, половину из остальных.'),
      checks));

    var report = h('div', { class: 'report', 'aria-live': 'polite' });
    var input = h('input', { type: 'file', accept: '.csv,text/csv,text/plain', multiple: true, 'aria-label': 'Выбрать CSV-файлы' });
    input.addEventListener('change', function () { loadFiles(input.files, report); input.value = ''; });
    root.appendChild(h('section', { class: 't-sec' },
      h('h2', null, 'Новые вопросы'),
      h('p', null, 'Выберите CSV-файлы, по одному на предмет. Название файла станет названием предмета. Новые файлы заменят все текущие вопросы.'),
      h('label', { class: 'btn btn-quiet file-btn' }, 'Выбрать CSV-файлы', input),
      report));

    root.appendChild(h('section', { class: 't-sec' },
      h('h2', null, 'Скачать тренажёр'),
      h('p', null, 'Файл со всеми текущими вопросами и отметками театрального блока. Его можно отправить студентам.'),
      h('button', { type: 'button', class: 'btn', onclick: exportTrainer }, 'Скачать файл тренажёра')));

    root.appendChild(formatHelp());
    mount(root, false);
  }

  function loadFiles(fileList, report) {
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length) return;
    report.textContent = 'Читаю файлы…';
    Promise.all(files.map(readFileText)).then(function (texts) {
      var names = {};
      var entries = files.map(function (f, k) {
        var name = C.subjectNameFromFile(f.name), base = name, n = 2;
        while (names[name]) name = base + ' (' + (n++) + ')';
        names[name] = true;
        var prev = S.subjects.filter(function (s) { return s.name === name; })[0];
        return { name: name, csv: texts[k], theatre: prev ? prev.theatre : false, res: C.parseSubject(name, texts[k]) };
      });
      showReport(entries, report);
    }).catch(function (e) {
      report.textContent = 'Не удалось прочитать файлы: ' + (e && e.message ? e.message : e);
    });
  }

  function showReport(entries, report) {
    report.textContent = '';
    var total = 0, anyErr = false;
    var list = h('ul', { class: 'rep' });
    entries.forEach(function (e) {
      var qs = e.res.questions;
      total += qs.length;
      var li = h('li', null, h('p', { class: 'rep-name' }, e.name),
        h('p', { class: 'rep-meta' }, nq(qs.length) + (qs.length ? ' (' + typeSummary(qs) + ')' : '') + '.'));
      if (e.res.errors.length) {
        anyErr = true;
        var errs = h('ul', { class: 'rep-err' });
        e.res.errors.slice(0, 8).forEach(function (m) { errs.appendChild(h('li', null, m)); });
        if (e.res.errors.length > 8) errs.appendChild(h('li', null, 'и ещё ' + (e.res.errors.length - 8)));
        li.appendChild(errs);
      }
      list.appendChild(li);
    });
    report.appendChild(list);
    if (anyErr) report.appendChild(h('p', { class: 'rep-note' }, 'Строки с ошибками в тренажёр не попадут. Исправьте их в файле и загрузите снова.'));
    if (!total) { report.appendChild(h('p', { class: 'rep-note' }, 'В файлах не нашлось ни одного вопроса.')); return; }
    report.appendChild(h('button', { type: 'button', class: 'btn', onclick: function () {
      applyBank({ version: 1, mock: S.data.mock, subjects: entries.map(function (e) {
        return { name: e.name, theatre: e.theatre, csv: e.csv };
      }) });
      S.session = null;
      store.del('session');
      S.msg = 'Готово: в тренажёре ' + nq(S.questions.length) + '. Отметьте театральный блок и скачайте файл.';
      renderTeacher();
    } }, 'Использовать эти вопросы (' + total + ')'));
  }

  function exportTrainer() {
    var data = { version: 1, mock: S.data.mock, subjects: S.data.subjects.map(function (s) {
      return { name: s.name, theatre: !!s.theatre, csv: s.csv };
    }) };
    var doc = document.documentElement.cloneNode(true);
    doc.querySelector('#app').textContent = '';
    doc.querySelector('#bank').textContent = C.bankToJSON(data);
    var html = '<!doctype html>\n' + doc.outerHTML;
    var url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
    var a = h('a', { href: url, download: 'Тренажер_к_тесту.html' });
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 20000);
  }

  function formatHelp() {
    function code(t) { return h('code', null, t); }
    return h('details', { class: 't-sec fmt' },
      h('summary', null, 'Формат CSV-файла'),
      h('dl', null,
        h('dt', null, 'Общее'),
        h('dd', null, 'Первая строка: ', code('Q;Q_opt;Answer'), '. Разделитель — точка с запятой (запятая тоже подойдёт). Кодировка UTF-8 или Windows-1251.'),
        h('dt', null, 'Один ответ'),
        h('dd', null, 'Q_opt: ', code('A) …; B) …; C) …; D) …'), ', Answer: ', code('B')),
        h('dt', null, 'Несколько ответов'),
        h('dd', null, 'Q_opt: ', code('A) …; B) …; C) …; D) …; E) …'), ', Answer: ', code('A; C; E')),
        h('dt', null, 'Последовательность'),
        h('dd', null, 'Q_opt: ', code('1. …; 2. …; 3. …; 4. …'), ', Answer: номера в правильном порядке, например ', code('2; 4; 1; 3')),
        h('dt', null, 'Соответствие'),
        h('dd', null, 'Q_opt: ', code('1. …; 2. …; 3. …; 4. …; A) …; B) …; C) …; D) …'), ', Answer: ', code('1-C; 2-D; 3-A; 4-B')),
        h('dt', null, 'Открытый вопрос'),
        h('dd', null, 'Q_opt оставьте пустым. Answer: слово, словосочетание или год. Несколько верных ответов пишутся через ', code('|'),
          ', например ', code('Абстрактное искусство|Абстракционизм'),
          '. При проверке не учитываются заглавные буквы, лишние пробелы, ё/е, кавычки и точка в конце.')));
  }

  /* ---------- Start ---------- */
  var data;
  try { data = JSON.parse(document.getElementById('bank').textContent || '{}'); } catch (e) { data = {}; }
  applyBank(data);
  renderHome();
})();
</script>
</body>
